name: Unzip portfolio
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site and commit
        run: |
          for z in *.zip; do unzip -o "$z" -d . && git rm -q "$z"; done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish portfolio site from zip" || exit 0
          git push
